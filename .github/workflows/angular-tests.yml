name: Angular Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  checkout:
    name: 📥 Initial Checkout
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

  env-info:
    name: 🔍 Environment Info
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Node & OS Details
        run: |
          node -v
          npm -v
          uname -a

  workspace-check:
    name: 📂 Workspace Listing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: List files
        run: ls -la

  disk-usage:
    name: 📊 Disk Usage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Check space
        run: du -sh .

  setup-node:
    name: ⚙️ Setup Node.js
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Use Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: 20

  install-deps:
    name: 📦 Install Dependencies
    runs-on: ubuntu-latest
    needs: setup-node
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Install
        run: npm install

  lint:
    name: 🎨 Lint
    runs-on: ubuntu-latest
    needs: install-deps
    steps:
      - name: Run ESLint
        run: npm run lint

  build:
    name: 🏗️ Build App
    runs-on: ubuntu-latest
    needs: install-deps
    steps:
      - name: Build Angular
        run: npm run build --if-present

  test:
    name: 🧪 Test App
    runs-on: ubuntu-latest
    needs: install-deps
    steps:
      - name: Run Unit Tests
        run: npm test -- --watch=false --browsers=ChromeHeadless

  audit:
    name: 🔐 Security Audit
    runs-on: ubuntu-latest
    needs: install-deps
    steps:
      - name: Run Audit
        run: npm audit --audit-level=high || true
