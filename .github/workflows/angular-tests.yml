name: Angular Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint:
    name: 🎨 Code Quality Check (Lint)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v3

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: 📦 Install Dependencies
        run: |
          echo "::group::Installing Dependencies"
          npm ci
          echo "::endgroup::"

      - name: 🔍 Run ESLint
        run: |
          echo "::group::Running ESLint"
          npm run lint
          echo "::endgroup::"

  build:
    name: 🏗️ Angular Build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v3

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: 📦 Install Dependencies
        run: |
          echo "::group::Installing Dependencies"
          npm ci
          echo "::endgroup::"

      - name: 🛠️ Run Build
        run: |
          echo "::group::Building Angular App"
          npm run build --if-present
          echo "::endgroup::"

  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v3

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: 📦 Install Dependencies
        run: |
          echo "::group::Installing Dependencies"
          npm ci
          echo "::endgroup::"

      - name: 🧪 Unit Tests
        run: |
          echo "::group::Executing Karma Tests"
          npm test -- --watch=false --browsers=ChromeHeadless
          echo "::endgroup::"

  audit:
    name: 🔐 Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v3

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: 📦 Install Dependencies
        run: |
          echo "::group::Installing Dependencies"
          npm ci
          echo "::endgroup::"

      - name: 🛡️ Run NPM Audit
        run: |
          echo "::group::Running npm audit"
          npm audit --audit-level=high || true
          echo "::endgroup::"
