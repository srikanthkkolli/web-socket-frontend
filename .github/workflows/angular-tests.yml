name: Angular Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v3

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔧 Build Angular app (optional sanity check)
        run: npm run build --if-present

      - name: 🧪 Run unit tests
        run: npm test -- --watch=false --browsers=ChromeHeadless
