name: Angular Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint:
    name: 🧹 Lint
    runs-on: self-hosted
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v3
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: 📦 Install dependencies
        run: npm ci
      - name: 🧹 Lint
        run: npm run lint

  build:
    name: 🏗️ Build
    runs-on: self-hosted
    needs: lint
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v3
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: 📦 Install dependencies
        run: npm ci
      - name: 🏗️ Build
        run: npm run build --if-present

  test:
    name: 🧪 Test
    runs-on: self-hosted
    needs: build
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v3
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: 📦 Install dependencies
        run: npm ci
      - name: 🧪 Test
        run: npm test -- --watch=false --browsers=ChromeHeadless

  audit:
    name: 🔐 Audit
    runs-on: self-hosted
    needs: build
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v3
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: 📦 Install dependencies
        run: npm ci
      - name: 🔐 Audit
        run: npm audit --audit-level=high || true
