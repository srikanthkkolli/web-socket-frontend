name: Angular Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  angular-checks:
    name: ⚙️ Lint + Build + Test + Audit
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v3

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🎨 Run Lint
        run: npm run lint

      - name: 🏗️ Build App
        run: npm run build --if-present

      - name: 🧪 Run Unit Tests
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: 🔐 Security Audit
        run: npm audit --audit-level=high || true
